name: SCRAPER | EAN | rewindrecords_org

run-name: SCRAPER | rewindrecords_org | EAN

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum records"
        required: true
        default: "250"
        type: string

permissions:
  contents: write

jobs:
  scraper:
    uses: ./.github/workflows/scraper-single-reusable.yml
    with:
      scraper_slug: rewindrecords_org
      mode: ean
      limit: ${{ inputs.limit }}
