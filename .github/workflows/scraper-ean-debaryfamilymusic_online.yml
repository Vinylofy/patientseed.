name: SCRAPER | EAN | debaryfamilymusic_online

run-name: SCRAPER | debaryfamilymusic_online | EAN

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum records"
        required: true
        default: "250"
        type: string

permissions:
  contents: write

jobs:
  scraper:
    uses: ./.github/workflows/scraper-single-reusable.yml
    with:
      scraper_slug: debaryfamilymusic_online
      mode: ean
      limit: ${{ inputs.limit }}
