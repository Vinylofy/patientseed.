name: Manual bounded collector cycle

on:
  workflow_dispatch:
    inputs:
      start_index:
        description: "Queue position to resume from"
        required: true
        default: "0"
        type: string
      batch_limit:
        description: "Maximum number of domains to process in this manual run"
        required: true
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: manual-collector-cycle
  cancel-in-progress: false

jobs:
  public-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run bounded public listing pilot
        run: python -m collector.manual_run --queue collector/public-queue.json --start-index "${{ inputs.start_index }}" --batch-limit "${{ inputs.batch_limit }}" | tee collector-run.json
      - name: Upload read-only run result
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: manual-collector-result-${{ github.run_id }}
          path: collector-run.json
          if-no-files-found: error
          retention-days: 14
