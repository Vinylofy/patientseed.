name: SCRAPER | Batch | Discovery and build

on:
  schedule:
    # Ten sequential queue batches per UTC day; the durable cursor advances
    # after each successful run. Concurrency below prevents overlap.
    - cron: "7 0 * * *"
    - cron: "7 2 * * *"
    - cron: "7 4 * * *"
    - cron: "7 6 * * *"
    - cron: "7 8 * * *"
    - cron: "7 10 * * *"
    - cron: "7 12 * * *"
    - cron: "7 14 * * *"
    - cron: "7 16 * * *"
    - cron: "7 18 * * *"
  workflow_dispatch:
    inputs:
      batch_limit:
        description: "Maximum number of domains to process in this manual run"
        required: true
        default: "100"
        type: string
      reset_cursor:
        description: "Reset the durable cursor to the first shop row before this run"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: manual-collector-cycle
  cancel-in-progress: false

jobs:
  public-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate batch limit
        env:
          BATCH_LIMIT: ${{ inputs.batch_limit || '100' }}
        run: |
          if [[ ! "$BATCH_LIMIT" =~ ^[0-9]+$ ]]; then
            echo "batch_limit must be a whole number greater than zero (received: $BATCH_LIMIT)" >&2
            exit 1
          fi
          QUEUE_SIZE=$(python - <<'PY'
          import json
          from pathlib import Path
          print(len(json.loads(Path("collector/public-queue.json").read_text(encoding="utf-8"))))
          PY
          )
          if (( BATCH_LIMIT < 1 || BATCH_LIMIT > QUEUE_SIZE )); then
            echo "batch_limit must be between 1 and $QUEUE_SIZE (received: $BATCH_LIMIT)" >&2
            exit 1
          fi
      - name: Reset durable public queue position
        if: ${{ inputs.reset_cursor }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m collector.progress reset --queue collector/public-queue.json
      - name: Reload durable public queue position after reset
        if: ${{ inputs.reset_cursor }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m collector.progress prepare --queue collector/public-queue.json --file collector-start-index.txt
      - name: Load durable public queue position
        if: ${{ !inputs.reset_cursor }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m collector.progress prepare --queue collector/public-queue.json --file collector-start-index.txt
      - name: Run bounded public source cycle
        if: ${{ env.COLLECTOR_EXHAUSTED != 'true' }}
        env:
          BATCH_LIMIT: ${{ inputs.batch_limit || '100' }}
        run: python -m collector.manual_run --queue collector/public-queue.json --start-index "$(cat collector-start-index.txt)" --batch-limit "$BATCH_LIMIT" --output collector-run.json
      - name: Build and self-test scraper wrappers
        if: ${{ env.COLLECTOR_EXHAUSTED != 'true' }}
        run: python -m collector.build_scrapers --result collector-run.json --output collector/generated
      - name: Generate per-scraper Action wrappers
        if: ${{ env.COLLECTOR_EXHAUSTED != 'true' }}
        run: python -m collector.generate_scraper_workflows --profiles collector/generated --output .github/workflows
      - name: Update scraper lifecycle and freeze exhausted shops
        if: ${{ env.COLLECTOR_EXHAUSTED != 'true' }}
        run: |
          python -m collector.lifecycle \
            --result collector-run.json \
            --state collector/scraper-lifecycle.json \
            --frozen-root collector/frozen \
            --max-attempts 3
      - name: Commit central lifecycle status
        if: ${{ env.COLLECTOR_EXHAUSTED != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector/scraper-lifecycle.json collector/scraper-lifecycle.md collector/frozen .github/workflows/scraper-*.yml
          if git diff --cached --quiet; then
            echo "No lifecycle status changes to commit."
          else
            git commit -m "Record scraper lifecycle status"
            git push
          fi
      - name: Publish generated scrapers
        if: ${{ env.COLLECTOR_EXHAUSTED != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m collector.publish_generated --root collector/generated
      - name: Upload generated scraper files
        if: ${{ env.COLLECTOR_EXHAUSTED != 'true' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: generated-scrapers-${{ github.run_id }}
          path: collector/generated
          if-no-files-found: warn
          retention-days: 30
      - name: Upload read-only run result
        if: ${{ always() && env.COLLECTOR_EXHAUSTED != 'true' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: manual-collector-result-${{ github.run_id }}
          path: collector-run.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save durable public queue position
        if: ${{ env.COLLECTOR_EXHAUSTED != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m collector.progress publish --queue collector/public-queue.json --file collector-run.json
      - name: Load central status data
        if: ${{ env.COLLECTOR_EXHAUSTED != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m collector.progress export --queue collector/public-queue.json --file collector-progress.json
      - name: Render one central shop status list
        if: ${{ env.COLLECTOR_EXHAUSTED != 'true' }}
        run: python -m collector.status --queue collector/public-queue.json --progress collector-progress.json --output scraper-status.md
      - name: Commit central queue status
        if: ${{ env.COLLECTOR_EXHAUSTED != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scraper-status.md
          if git diff --cached --quiet; then
            echo "No central queue status changes to commit."
          else
            git pull --rebase origin main
            git commit -m "Update central scraper queue status"
            git push
          fi
      - name: Upload central shop status snapshot
        if: ${{ env.COLLECTOR_EXHAUSTED != 'true' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: central-scraper-status-${{ github.run_id }}
          path: scraper-status.md
          if-no-files-found: error
          retention-days: 14
