name: SCRAPER | Batch | Quality admission and repair
run-name: Quality | 25 candidates maximum | ${{ github.event_name }}
on:
  schedule:
    - cron: "37 0 * * *"
  workflow_dispatch:
    inputs:
      batch_limit:
        description: "Maximum shops (1-25); automatically resumes unfinished candidates"
        type: string
        required: true
        default: "25"
permissions:
  contents: write
concurrency:
  group: scraper-quality-admission
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: scraper-builds
          path: published
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: scraper-quality
          path: release
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Preserve base for concurrent-edit protection
        run: cp release/quality/state.json release/quality/base-state.json
      - name: Validate up to 25 shops without credentials
        env:
          BATCH_LIMIT: ${{ inputs.batch_limit || '25' }}
          RUN_ID: ${{ github.run_id }}
        run: python -u -m collector.quality_gate --profiles published/collector/generated --state-root release/quality --limit "$BATCH_LIMIT" --run-id "$RUN_ID"
      - name: Persist checkpoints, freeze copies and central status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m collector.quality_store --root release/quality
      - name: Save bounded source evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: quality-batch-${{ github.run_id }}
          path: |
            quality-batch-result.json
            release/quality/state.json
            release/quality/frozen/
          if-no-files-found: error
          retention-days: 30
