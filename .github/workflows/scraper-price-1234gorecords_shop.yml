name: SCRAPER | 1234gorecords_shop

run-name: SCRAPER | 1234gorecords_shop | Price

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum records"
        required: true
        default: "250"
        type: string

jobs:
  scraper:
    uses: ./.github/workflows/scraper-single-reusable.yml
    with:
      scraper_slug: 1234gorecords_shop
      mode: price
      limit: ${{ inputs.limit }}
