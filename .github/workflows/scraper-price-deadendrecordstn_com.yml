name: SCRAPER | Price | deadendrecordstn_com

run-name: SCRAPER | deadendrecordstn_com | Price

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum records"
        required: true
        default: "250"
        type: string

permissions:
  contents: write

jobs:
  scraper:
    uses: ./.github/workflows/scraper-single-reusable.yml
    with:
      scraper_slug: deadendrecordstn_com
      mode: price
      limit: ${{ inputs.limit }}
