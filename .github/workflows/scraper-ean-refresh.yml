name: SCRAPER | Batch | EAN refresh

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximaal aantal EAN-detailrecords"
        required: true
        default: "250"
        type: string

permissions:
  contents: write

concurrency:
  group: scraper-ean-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: scraper-builds
          path: published
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run read-only EAN collection
        env:
          LIMIT: ${{ inputs.limit || '250' }}
        run: python -m collector.execute_generated --root published/collector/generated --mode ean --limit "$LIMIT" --output ean-refresh.json
      - name: Write per-scraper summary
        run: python -m collector.render_run_summary --result ean-refresh.json
      - name: Update scraper health state
        env:
          GH_RUN_ID: ${{ github.run_id }}
        run: python -m collector.health --result ean-refresh.json --state collector/scraper-health.json --profiles published/collector/generated --run-id "$GH_RUN_ID"
      - name: Commit scraper health state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector/scraper-health.json collector/scraper-health.md
          if git diff --cached --quiet; then
            echo "No scraper health changes to commit."
          else
            git pull --rebase origin main
            git commit -m "Record EAN scraper health"
            git push
          fi
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: scraper-ean-refresh-${{ github.run_id }}
          path: ean-refresh.json
          if-no-files-found: error
          retention-days: 30
