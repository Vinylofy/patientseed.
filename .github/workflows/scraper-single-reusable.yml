name: SCRAPER | Reusable single runner

on:
  workflow_call:
    inputs:
      require_approved:
        required: false
        type: boolean
        default: false
      scraper_slug:
        required: true
        type: string
      mode:
        required: true
        type: string
      limit:
        required: true
        type: string

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: scraper-builds
          path: published
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: scraper-quality
          path: release
          persist-credentials: false
      - name: Validate scraper profile
        env:
          SLUG: ${{ inputs.scraper_slug }}
          LIMIT: ${{ inputs.limit }}
        run: |
          test -f "published/collector/generated/$SLUG.json"
          test -f "published/collector/generated/$SLUG.py"
          [[ "$LIMIT" =~ ^[0-9]+$ ]] && (( LIMIT >= 1 && LIMIT <= 250 ))
      - name: Run single scraper
        env:
          SLUG: ${{ inputs.scraper_slug }}
          MODE: ${{ inputs.mode }}
          LIMIT: ${{ inputs.limit }}
          REQUIRE_APPROVED: ${{ inputs.require_approved }}
        run: |
          args=()
          if [ "$REQUIRE_APPROVED" = "true" ]; then args+=(--quality-root release/quality); fi
          python -m collector.execute_generated --root published/collector/generated --profile "$SLUG" --mode "$MODE" --limit "$LIMIT" --output single-scraper-result.json "${args[@]}"
      - name: Persist per-scraper maintenance observation
        if: always() && hashFiles('single-scraper-result.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: python -m collector.quality_store --result single-scraper-result.json --run-id "$RUN_ID"
      - name: Write per-scraper summary
        if: always() && hashFiles('single-scraper-result.json') != ''
        run: python -m collector.render_run_summary --result single-scraper-result.json
      - if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: scraper-${{ inputs.mode }}-${{ inputs.scraper_slug }}-${{ github.run_id }}
          path: single-scraper-result.json
          if-no-files-found: error
          retention-days: 30
