name: SCRAPER | EAN | ags_earth

run-name: SCRAPER | ags_earth | EAN

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum records"
        required: true
        default: "250"
        type: string

permissions:
  contents: write

jobs:
  scraper:
    uses: ./.github/workflows/scraper-single-reusable.yml
    with:
      scraper_slug: ags_earth
      mode: ean
      limit: ${{ inputs.limit }}
