name: SCRAPER | EAN | tinybot_com

run-name: SCRAPER | tinybot_com | EAN

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum records"
        required: true
        default: "250"
        type: string

permissions:
  contents: write

jobs:
  scraper:
    uses: ./.github/workflows/scraper-single-reusable.yml
    with:
      scraper_slug: tinybot_com
      mode: ean
      limit: ${{ inputs.limit }}
