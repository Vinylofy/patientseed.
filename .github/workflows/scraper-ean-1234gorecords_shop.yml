name: SCRAPER | EAN | 1234gorecords_shop

run-name: SCRAPER | 1234gorecords_shop | EAN

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum records"
        required: true
        default: "250"
        type: string

permissions:
  contents: write

jobs:
  scraper:
    uses: ./.github/workflows/scraper-single-reusable.yml
    with:
      scraper_slug: 1234gorecords_shop
      mode: ean
      limit: ${{ inputs.limit }}
