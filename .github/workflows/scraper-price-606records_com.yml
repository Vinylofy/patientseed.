name: SCRAPER | Price | 606records_com

run-name: SCRAPER | 606records_com | Price

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum records"
        required: true
        default: "250"
        type: string

jobs:
  scraper:
    uses: ./.github/workflows/scraper-single-reusable.yml
    with:
      scraper_slug: 606records_com
      mode: price
      limit: ${{ inputs.limit }}
