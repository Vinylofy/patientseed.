name: SCRAPER | Manual | Single scraper

run-name: SCRAPER | Manual | ${{ inputs.mode }} | ${{ inputs.scraper_slug }}

on:
  workflow_dispatch:
    inputs:
      scraper_slug:
        description: "Generated scraper slug, e.g. 22soundrecords_com"
        required: true
        type: string
      mode:
        description: "Read-only collection mode"
        required: true
        default: "price"
        type: choice
        options:
          - price
          - ean
      limit:
        description: "Maximum records for this single-scraper pilot"
        required: true
        default: "250"
        type: string

permissions:
  contents: read

concurrency:
  group: scraper-single-${{ inputs.scraper_slug }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: scraper-builds
          path: published
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate scraper profile
        env:
          SLUG: ${{ inputs.scraper_slug }}
          LIMIT: ${{ inputs.limit }}
        run: |
          test -f "published/collector/generated/$SLUG.json"
          test -f "published/collector/generated/$SLUG.py"
          [[ "$LIMIT" =~ ^[0-9]+$ ]] && (( LIMIT >= 1 && LIMIT <= 250 ))
      - name: Run single scraper
        env:
          SLUG: ${{ inputs.scraper_slug }}
          MODE: ${{ inputs.mode }}
          LIMIT: ${{ inputs.limit }}
        run: python -m collector.execute_generated --root published/collector/generated --profile "$SLUG" --mode "$MODE" --limit "$LIMIT" --output single-scraper-result.json
      - name: Write per-scraper summary
        run: python -m collector.render_run_summary --result single-scraper-result.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: scraper-${{ inputs.mode }}-${{ inputs.scraper_slug }}-${{ github.run_id }}
          path: single-scraper-result.json
          if-no-files-found: error
          retention-days: 30
