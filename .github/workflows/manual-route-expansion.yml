name: Manual route expansion and detail gate

on:
  workflow_dispatch:
    inputs:
      candidate_limit:
        description: "Maximum prior candidates to route-discover"
        required: true
        default: "1000"
        type: string
      catalog_pages:
        description: "Catalog pages after route discovery (1-5)"
        required: true
        default: "3"
        type: string
      detail_samples:
        description: "Detail pages after route discovery (1-3)"
        required: true
        default: "2"
        type: string

permissions:
  contents: write

concurrency:
  group: manual-route-expansion
  cancel-in-progress: false

jobs:
  route-expansion:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate route-expansion bounds
        env:
          CANDIDATE_LIMIT: ${{ inputs.candidate_limit }}
          CATALOG_PAGES: ${{ inputs.catalog_pages }}
          DETAIL_SAMPLES: ${{ inputs.detail_samples }}
        run: |
          [[ "$CANDIDATE_LIMIT" =~ ^[0-9]+$ ]] && (( CANDIDATE_LIMIT >= 1 )) || { echo "candidate_limit must be positive" >&2; exit 1; }
          [[ "$CATALOG_PAGES" =~ ^[1-5]$ ]] || { echo "catalog_pages must be 1 through 5" >&2; exit 1; }
          [[ "$DETAIL_SAMPLES" =~ ^[1-3]$ ]] || { echo "detail_samples must be 1 through 3" >&2; exit 1; }
      - name: Load central progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m collector.progress export --queue collector/public-queue.json --file collector-progress.json
      - name: Discover routes and run detail gate
        env:
          CANDIDATE_LIMIT: ${{ inputs.candidate_limit }}
          CATALOG_PAGES: ${{ inputs.catalog_pages }}
          DETAIL_SAMPLES: ${{ inputs.detail_samples }}
        run: >-
          python -m collector.route_expansion --queue collector/public-queue.json
          --progress collector-progress.json --candidate-limit "$CANDIDATE_LIMIT"
          --catalog-pages "$CATALOG_PAGES" --detail-samples "$DETAIL_SAMPLES"
          --output route-expansion.json
      - name: Build and self-test new scraper wrappers
        run: python -m collector.build_scrapers --result route-expansion.json --output collector/generated
      - name: Publish generated scrapers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m collector.publish_generated --root collector/generated
      - name: Save route expansion results without advancing queue cursor
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m collector.progress publish-recheck --queue collector/public-queue.json --file route-expansion.json
      - name: Export and render central status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m collector.progress export --queue collector/public-queue.json --file collector-progress.json
          python -m collector.status --queue collector/public-queue.json --progress collector-progress.json --output scraper-status.md
      - name: Upload route expansion result and status
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: route-expansion-${{ github.run_id }}
          path: |
            route-expansion.json
            scraper-status.md
          if-no-files-found: error
          retention-days: 14
