name: SCRAPER | Price | allthebestflorence_com

run-name: SCRAPER | allthebestflorence_com | Price

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum records"
        required: true
        default: "250"
        type: string

jobs:
  scraper:
    uses: ./.github/workflows/scraper-single-reusable.yml
    with:
      scraper_slug: allthebestflorence_com
      mode: price
      limit: ${{ inputs.limit }}
