name: Daily scraper health repair

on:
  schedule:
    - cron: "7 20 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of failing scraper/mode pairs to repair"
        required: true
        default: "100"
        type: string

permissions:
  contents: write

concurrency:
  group: scraper-health-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: scraper-builds
          path: published
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate repair limit
        env:
          LIMIT: ${{ inputs.limit || '100' }}
        run: |
          if [[ ! "$LIMIT" =~ ^[0-9]+$ ]] || (( LIMIT < 1 || LIMIT > 100 )); then
            echo "limit must be between 1 and 100 (received: $LIMIT)" >&2
            exit 1
          fi
      - name: Run bounded scraper repairs
        env:
          GH_RUN_ID: ${{ github.run_id }}
          LIMIT: ${{ inputs.limit || '100' }}
        run: |
          python -m collector.repair \
            --state collector/scraper-health.json \
            --profiles published/collector/generated \
            --frozen-root collector/frozen \
            --limit "$LIMIT" \
            --run-id "$GH_RUN_ID" \
            --output scraper-repair.json
      - name: Commit health state and frozen evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector/scraper-health.json collector/scraper-health.md collector/frozen
          if git diff --cached --quiet; then
            echo "No repair state changes to commit."
          else
            git pull --rebase origin main
            git commit -m "Record scraper repair state"
            git push
          fi
      - name: Publish repaired profiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m collector.publish_generated --root published/collector/generated
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: scraper-repair-${{ github.run_id }}
          path: scraper-repair.json
          if-no-files-found: error
          retention-days: 30
